<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Persotodo — a calm personal task list.">
  <meta name="theme-color" content="#f4f0e7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
  <title>Persotodo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142421;
      --muted: #66736f;
      --paper: #f4f0e7;
      --card: #fffdf8;
      --line: #d8d3c8;
      --green: #21695a;
      --green-soft: #dcebe4;
      --red: #a64235;
      --shadow: 0 24px 70px rgba(36, 47, 42, .12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 5%, rgba(230, 181, 112, .2), transparent 28rem),
        radial-gradient(circle at 90% 90%, rgba(33, 105, 90, .12), transparent 30rem),
        var(--paper);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .shell { width: min(780px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 54px; }
    .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 750; letter-spacing: -.02em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 13px; color: white; background: var(--green); box-shadow: 0 8px 20px rgba(33, 105, 90, .2); }
    .back, .logout { border: 0; background: transparent; color: var(--muted); text-decoration: none; font-size: .9rem; }
    .back:hover, .logout:hover { color: var(--ink); }
    .card { border: 1px solid rgba(75, 84, 80, .14); border-radius: 28px; background: rgba(255, 253, 248, .88); box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .gate { width: min(460px, 100%); margin: 8vh auto 0; padding: clamp(28px, 7vw, 50px); text-align: center; }
    .eyebrow { margin: 0 0 12px; color: var(--green); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.6rem, 8vw, 4.6rem); font-weight: 500; letter-spacing: -.055em; line-height: .95; }
    .intro { max-width: 30rem; margin: 18px auto 0; color: var(--muted); line-height: 1.65; }
    .pin-form { display: grid; gap: 12px; margin-top: 30px; }
    .pin-input { width: 100%; padding: 15px 18px; border: 1px solid var(--line); border-radius: 14px; outline: none; background: white; color: var(--ink); font-size: 1.35rem; letter-spacing: .3em; text-align: center; }
    .pin-input:focus, .new-task:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(33, 105, 90, .12); }
    .primary { min-height: 52px; border: 0; border-radius: 14px; background: var(--green); color: white; font-weight: 750; box-shadow: 0 10px 24px rgba(33, 105, 90, .18); }
    .primary:hover { background: #185547; }
    .primary:disabled { cursor: wait; opacity: .65; }
    .error { min-height: 1.25rem; margin: 4px 0 0; color: var(--red); font-size: .88rem; }
    .app-header { margin-bottom: 30px; }
    .app-header-row { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .summary { margin: 14px 0 0; color: var(--muted); }
    .todo-card { overflow: hidden; }
    .composer { display: flex; gap: 10px; padding: 18px; border-bottom: 1px solid var(--line); }
    .new-task { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 13px; outline: none; background: white; color: var(--ink); }
    .add-button { padding: 0 22px; border: 0; border-radius: 13px; background: var(--ink); color: white; font-weight: 750; }
    .filters { display: flex; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .filter { padding: 7px 12px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--muted); font-size: .84rem; }
    .filter[aria-pressed="true"] { border-color: #b9d3c8; background: var(--green-soft); color: var(--green); font-weight: 750; }
    .todo-list { margin: 0; padding: 0; list-style: none; }
    .todo { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; min-height: 66px; padding: 12px 18px; border-bottom: 1px solid rgba(216, 211, 200, .72); }
    .todo:last-child { border-bottom: 0; }
    .todo:hover { background: rgba(244, 240, 231, .5); }
    .check { width: 22px; height: 22px; margin: 0; accent-color: var(--green); }
    .todo-title { overflow-wrap: anywhere; line-height: 1.45; }
    .todo.done .todo-title { color: #8b9490; text-decoration: line-through; }
    .delete { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: #9a6c64; font-size: 1.25rem; }
    .delete:hover { background: #f8e4df; color: var(--red); }
    .empty { padding: 55px 24px; text-align: center; color: var(--muted); }
    .empty-symbol { display: block; margin-bottom: 10px; color: #9ab5ab; font-family: Georgia, serif; font-size: 2.5rem; }
    .status { min-height: 1.25rem; margin: 14px 4px 0; color: var(--muted); font-size: .85rem; }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 780px); padding-top: 18px; }
      .topbar { margin-bottom: 36px; }
      .app-header-row { align-items: start; }
      .composer { align-items: stretch; flex-direction: column; }
      .add-button { min-height: 48px; }
      .todo { padding-inline: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: arrive .45s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(12px); } }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/persotodo/" aria-label="Persotodo home"><span class="brand-mark">P</span><span>Persotodo</span></a>
      <a class="back" href="/">All apps</a>
    </header>

    <main>
      <section id="gate" class="gate card" aria-labelledby="gateTitle">
        <p class="eyebrow">Private workspace</p>
        <h1 id="gateTitle">Hello.</h1>
        <p class="intro">Your personal list is behind a four-digit PIN.</p>
        <form id="pinForm" class="pin-form">
          <label for="pin" class="eyebrow">Access PIN</label>
          <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required autofocus>
          <button id="unlock" class="primary" type="submit">Open Persotodo</button>
          <p id="pinError" class="error" role="alert" aria-live="polite"></p>
        </form>
      </section>

      <section id="workspace" hidden aria-labelledby="pageTitle">
        <header class="app-header">
          <div class="app-header-row">
            <div>
              <p class="eyebrow">Personal task list</p>
              <h1 id="pageTitle">Today, clearly.</h1>
            </div>
            <button id="logout" class="logout" type="button">Lock</button>
          </div>
          <p id="summary" class="summary">Loading your tasks...</p>
        </header>

        <div class="todo-card card">
          <form id="todoForm" class="composer">
            <label for="newTask" hidden>New task</label>
            <input id="newTask" class="new-task" type="text" maxlength="500" autocomplete="off" placeholder="What needs doing?" required>
            <button class="add-button" type="submit">Add task</button>
          </form>
          <nav class="filters" aria-label="Filter tasks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
          </nav>
          <ul id="todoList" class="todo-list"></ul>
          <div id="empty" class="empty" hidden><span class="empty-symbol">✓</span><span id="emptyText">Nothing here yet.</span></div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const gate = document.querySelector('#gate');
      const workspace = document.querySelector('#workspace');
      const pinForm = document.querySelector('#pinForm');
      const pinInput = document.querySelector('#pin');
      const pinError = document.querySelector('#pinError');
      const unlockButton = document.querySelector('#unlock');
      const todoForm = document.querySelector('#todoForm');
      const newTask = document.querySelector('#newTask');
      const todoList = document.querySelector('#todoList');
      const empty = document.querySelector('#empty');
      const emptyText = document.querySelector('#emptyText');
      const summary = document.querySelector('#summary');
      const status = document.querySelector('#status');
      const logout = document.querySelector('#logout');
      const filters = [...document.querySelectorAll('.filter')];

      let todos = [];
      let filter = 'all';

      async function api(path, options = {}) {
        const response = await fetch(`/api/persotodo${path}`, {
          credentials: 'same-origin',
          ...options,
          headers: options.body ? { 'Content-Type': 'application/json', ...options.headers } : options.headers
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 401 && path !== '/session') lock();
          throw new Error(payload.error || 'Request failed.');
        }
        return payload;
      }

      function lock() {
        workspace.hidden = true;
        gate.hidden = false;
        pinInput.value = '';
        pinInput.focus();
      }

      async function openWorkspace() {
        gate.hidden = true;
        workspace.hidden = false;
        await loadTodos();
        newTask.focus();
      }

      async function loadTodos() {
        const payload = await api('/todos');
        todos = payload.todos;
        render();
      }

      function render() {
        const activeCount = todos.filter(todo => !todo.completed).length;
        summary.textContent = `${activeCount} ${activeCount === 1 ? 'task' : 'tasks'} left · ${todos.length} total`;
        const visible = todos.filter(todo => filter === 'all' || (filter === 'done' ? todo.completed : !todo.completed));
        todoList.replaceChildren();

        for (const todo of visible) {
          const item = document.createElement('li');
          item.className = `todo${todo.completed ? ' done' : ''}`;

          const checkbox = document.createElement('input');
          checkbox.className = 'check';
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.setAttribute('aria-label', `Mark ${todo.title} ${todo.completed ? 'active' : 'complete'}`);
          checkbox.addEventListener('change', () => updateTodo(todo.id, { completed: checkbox.checked }));

          const title = document.createElement('span');
          title.className = 'todo-title';
          title.textContent = todo.title;

          const remove = document.createElement('button');
          remove.className = 'delete';
          remove.type = 'button';
          remove.textContent = '×';
          remove.setAttribute('aria-label', `Delete ${todo.title}`);
          remove.addEventListener('click', () => deleteTodo(todo.id));

          item.append(checkbox, title, remove);
          todoList.append(item);
        }

        empty.hidden = visible.length !== 0;
        emptyText.textContent = filter === 'all' ? 'Your list is clear.' : `No ${filter} tasks.`;
      }

      async function updateTodo(id, changes) {
        status.textContent = 'Saving...';
        try {
          const payload = await api(`/todos/${id}`, { method: 'PATCH', body: JSON.stringify(changes) });
          todos = todos.map(todo => todo.id === id ? payload.todo : todo);
          status.textContent = 'Saved.';
          render();
        } catch (error) {
          status.textContent = error.message;
          await loadTodos().catch(() => {});
        }
      }

      async function deleteTodo(id) {
        status.textContent = 'Deleting...';
        try {
          await api(`/todos/${id}`, { method: 'DELETE' });
          todos = todos.filter(todo => todo.id !== id);
          status.textContent = 'Deleted.';
          render();
        } catch (error) {
          status.textContent = error.message;
        }
      }

      pinForm.addEventListener('submit', async event => {
        event.preventDefault();
        pinError.textContent = '';
        unlockButton.disabled = true;
        try {
          await api('/session', { method: 'POST', body: JSON.stringify({ pin: pinInput.value }) });
          await openWorkspace();
        } catch (error) {
          pinError.textContent = error.message;
          pinInput.value = '';
          pinInput.focus();
        } finally {
          unlockButton.disabled = false;
        }
      });

      todoForm.addEventListener('submit', async event => {
        event.preventDefault();
        const title = newTask.value.trim();
        if (!title) return;
        status.textContent = 'Adding...';
        try {
          const payload = await api('/todos', { method: 'POST', body: JSON.stringify({ title }) });
          todos.unshift(payload.todo);
          newTask.value = '';
          status.textContent = 'Added.';
          render();
        } catch (error) {
          status.textContent = error.message;
        }
      });

      filters.forEach(button => button.addEventListener('click', () => {
        filter = button.dataset.filter;
        filters.forEach(candidate => candidate.setAttribute('aria-pressed', String(candidate === button)));
        render();
      }));

      logout.addEventListener('click', async () => {
        await api('/session', { method: 'DELETE' }).catch(() => {});
        todos = [];
        lock();
      });

      api('/session')
        .then(payload => payload.authenticated ? openWorkspace() : lock())
        .catch(() => {
          pinError.textContent = 'Persotodo is temporarily unavailable.';
          lock();
        });
    })();
  </script>
</body>
</html>
