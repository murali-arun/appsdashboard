name: Deploy to VPS via Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'index.html'
      - 'nginx.conf'
      - 'docker-compose.production.yml'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Build dashboard
        run: |
          npm ci
          npm run build

      - name: Test Persotodo API
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Verify release files
        run: |
          test -f dist/index.html
          test -f dist/persotodo/index.html
          test -f server/Dockerfile

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PERSOTODO_PIN: ${{ secrets.PERSOTODO_PIN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY PERSOTODO_PIN; do
            test -n "${!name}" || { echo "Missing required secret: ${name}"; exit 1; }
          done
          printf '%s' "$PERSOTODO_PIN" | grep -Eq '^[0-9]{4}$' || {
            echo "PERSOTODO_PIN must contain exactly four digits"
            exit 1
          }

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/appsdashboard/dist /opt/appsdashboard/server

      - name: Upload dashboard build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'dist/*'
          target: /opt/appsdashboard/dist/
          strip_components: 1
          overwrite: true

      - name: Upload Persotodo runtime
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'server/Dockerfile,server/.dockerignore,server/package.json,server/package-lock.json,server/src/**,nginx.conf,docker-compose.production.yml'
          target: /opt/appsdashboard/
          overwrite: true

      - name: Provision database and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          PERSOTODO_PIN: ${{ secrets.PERSOTODO_PIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: PERSOTODO_PIN
          script: |
            set -eu
            umask 077
            cd /opt/appsdashboard

            docker inspect litellm_db >/dev/null
            docker network inspect litellm_default >/dev/null

            DB_ADMIN_USER="$(docker inspect litellm_db --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_USER=//p' | head -n 1)"
            DB_ADMIN_PASSWORD="$(docker inspect litellm_db --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_PASSWORD=//p' | head -n 1)"
            DB_ADMIN_DATABASE="$(docker inspect litellm_db --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_DB=//p' | head -n 1)"
            test -n "$DB_ADMIN_USER" && test -n "$DB_ADMIN_PASSWORD" && test -n "$DB_ADMIN_DATABASE"

            APP_DB_PASSWORD="$(sed -n 's/^PERSOTODO_DB_PASSWORD=//p' .env 2>/dev/null | head -n 1 || true)"
            SESSION_SECRET="$(sed -n 's/^PERSOTODO_SESSION_SECRET=//p' .env 2>/dev/null | head -n 1 || true)"
            if [ -z "$APP_DB_PASSWORD" ]; then APP_DB_PASSWORD="$(openssl rand -hex 32)"; fi
            if [ -z "$SESSION_SECRET" ]; then SESSION_SECRET="$(openssl rand -hex 48)"; fi

            docker exec -i \
              -e PGPASSWORD="$DB_ADMIN_PASSWORD" \
              litellm_db psql -v ON_ERROR_STOP=1 \
              -v "app_password=$APP_DB_PASSWORD" \
              -U "$DB_ADMIN_USER" -d "$DB_ADMIN_DATABASE" <<'SQL'
            SELECT format('CREATE ROLE persotodo LOGIN PASSWORD %L', :'app_password')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'persotodo') \gexec
            SELECT format('ALTER ROLE persotodo LOGIN PASSWORD %L', :'app_password') \gexec
            SQL

            if ! docker exec -e PGPASSWORD="$DB_ADMIN_PASSWORD" litellm_db \
              psql -U "$DB_ADMIN_USER" -d "$DB_ADMIN_DATABASE" -Atc \
              "SELECT 1 FROM pg_database WHERE datname = 'persotodo'" | grep -qx 1; then
              docker exec -e PGPASSWORD="$DB_ADMIN_PASSWORD" litellm_db \
                createdb -U "$DB_ADMIN_USER" -O persotodo persotodo
            fi

            cat > .env <<EOF
            DATABASE_URL=postgresql://persotodo:$APP_DB_PASSWORD@litellm_db:5432/persotodo
            PERSOTODO_PIN=$PERSOTODO_PIN
            PERSOTODO_SESSION_SECRET=$SESSION_SECRET
            PERSOTODO_DB_PASSWORD=$APP_DB_PASSWORD
            EOF
            chmod 600 .env

            if docker compose version >/dev/null 2>&1; then
              COMPOSE='docker compose'
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE='docker-compose'
            else
              echo 'Docker Compose is not installed'
              exit 1
            fi

            stale_api="$(docker ps -aq --filter label=com.docker.compose.project=appsdashboard --filter label=com.docker.compose.service=api)"
            if [ -n "$stale_api" ]; then docker rm -f $stale_api >/dev/null; fi
            docker rm -f appsdashboard-api >/dev/null 2>&1 || true
            $COMPOSE -f docker-compose.production.yml up -d --build api
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' appsdashboard-api 2>/dev/null || true)"
              if [ "$status" = healthy ]; then break; fi
              if [ "$attempt" = 30 ]; then
                docker logs --tail=100 appsdashboard-api
                exit 1
              fi
              sleep 2
            done

            docker rm -f appsdashboard >/dev/null 2>&1 || true
            $COMPOSE -f docker-compose.production.yml up -d dashboard
            docker exec appsdashboard nginx -t
            docker exec appsdashboard wget -qO- http://127.0.0.1/persotodo/ | grep -q Clearspace
            docker exec appsdashboard-api node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            $COMPOSE -f docker-compose.production.yml ps
