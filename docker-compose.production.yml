services:
  dashboard:
    image: nginx:alpine
    container_name: appsdashboard
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - /opt/appsdashboard/dist:/usr/share/nginx/html:ro
      - /opt/appsdashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    restart: unless-stopped

  api:
    build: /opt/appsdashboard/server
    container_name: appsdashboard-api
    env_file:
      - /opt/appsdashboard/.env
    networks: [web, database]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  web:
    external: true
    name: npm_default
  database:
    external: true
    name: litellm_default
